<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function</title>
</head>
<body>
    <script>
     function greet(name){
        console.log("hellow"+name);
        
     }
     greet("chetna")

    //  function expression
    const add=function(a,b){
        return a+b;
    }
    console.log(add(5,3));

    // arrow function

    const multiply =(a,b)=>a*b
    console.log(multiply(5,5));
    
    
    
    </script>
</body>
</html>
